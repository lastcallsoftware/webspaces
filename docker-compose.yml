services:
  nginx:
    container_name: webspaces-nginx
    image: lastcallsoftware/webspaces:latest
    pull_policy: always
    ports:
      - "80:8080"
      - "443:8443"
    
    environment:
      - NODE_ENV=production
    
    volumes:
      # Persist Let's Encrypt certificates across container restarts
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
      # Mount the .htpasswd file for basic HTTP authentication
      - /srv/trackeats/.htpasswd:/etc/nginx/.htpasswd:ro

    restart: on-failure
    
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: www.lastcallsoftware.com", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Connect to the trackeats network
    networks:
      - trackeats-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node-exporter
    networks:
      - default
      - trackeats-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://www.lastcallsoftware.com/trackeats/metrics/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - default
      - trackeats-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  # Created and managed by the TrackEats compose stack.
  trackeats-net:
    external: true
    name: trackeats-net