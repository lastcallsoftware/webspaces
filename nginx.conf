# PORT NUMBERS > 1000
# Linux and WSL don't allow apps run by non-root users to bind to port numbers below 1000.
# We *could* run as root and use lower port numbers, but it's easier and more practical to 
# just have Docker remap incoming requests to port numbers above 1000 and bind to those ports.
# You'll see this port remapping in the docker-compose.yml.

# Do not write malformed-request 400 responses to the access log.
map $status $write_access_log {
    default 1;
    400     0;
}

# LOCAL DEVELOPMENT
# Serve the TrackEats app directly when accessed via localhost or 127.0.0.1 (no SSL needed).
server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 _;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# LAST CALL SOFTWARE HOME PAGE
# Redirect HTTP requests from "lastcallsoftware.com" and "www.lastcallsoftware.com" 
# to HTTPS "www.lastcallsoftware.com".
server {
    listen 80 default_server;
    listen 8080;

    server_name lastcallsoftware.com www.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.lastcallsoftware.com$request_uri;
    }
}
# Redirect HTTPS requests from "lastcallsoftware.com" 
# to HTTPS "www.lastcallsoftware.com".
server {
    listen 443 ssl;
    listen 8443 ssl;

    server_name lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    location / {
        return 301 https://www.lastcallsoftware.com$request_uri;
    }
}
# Listen for HTTPS requests to "www.lastcallsoftware.com".
server {
    listen 443 ssl default_server;
    listen 8443 ssl default_server;

    server_name www.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    root /usr/share/nginx/lastcallsoftware;
    index index.html;

    location = /trackeats/metrics {
        return 302 /trackeats/metrics/d/rYdddlPWk/node-exporter-full?kiosk;
    }

    location /trackeats/metrics/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# TRACKEATS FRONT END
# Redirect HTTP requests from "trackeats.com", "www.trackeats.com" and "trackeats.lastcallsoftware.com"
# to HTTPS "trackeats.lastcallsoftware.com".
server {
    listen 80;
    listen 8080;

    server_name trackeats.com www.trackeats.com trackeats.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trackeats.lastcallsoftware.com$request_uri;
    }
}
# Redirect HTTPS requests from "trackeats.com" and "www.trackeats.com"
# to HTTPS "trackeats.lastcallsoftware.com".
server {
    listen 443 ssl;
    listen 8443 ssl;

    server_name trackeats.com www.trackeats.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    location / {
        return 301 https://trackeats.lastcallsoftware.com$request_uri;
    }
}
# Listen for HTTPS requests to "trackeats.lastcallsoftware.com".
# Proxies to trackeats-frontend service on trackeats-net docker network.
server {
    listen 443 ssl;
    listen 8443 ssl;

    server_name trackeats.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://trackeats-backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $frontend_upstream http://trackeats-frontend:8080;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required for React routing (SPA)
        proxy_redirect off;
    }
}

